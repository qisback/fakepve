# GitHub copy only. The forge runs .forgejo/workflows/, which is not published.
name: ci
on:
  push:
    branches: [main, 'release/**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: install
        run: python -m pip install -c .github/ci-constraints.txt '.[test]' ruff requests pyyaml
      - name: ruff
        run: python -m ruff check --output-format=github .
      - name: tests
        run: python -m pytest -q -p no:cacheprovider

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: install
        run: python -m pip install -c .github/ci-constraints.txt . -r docs/requirements.txt
      - name: build
        run: properdocs build --strict

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: install
        run: python -m pip install -c .github/ci-constraints.txt build twine
      - name: build
        run: python -m build
      - name: twine check
        run: python -m twine check --strict dist/*

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: build
        run: docker build -t fakepve:ci .
      - name: smoke test
        run: sh tools/smoke_image.sh fakepve:ci
